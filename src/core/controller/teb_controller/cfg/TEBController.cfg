#!/usr/bin/env python
# TEB Controller dynamic reconfigure configuration

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t, int_t, bool_t

gen = ParameterGenerator()

# ============================================================
# Optimization horizon
# ============================================================
gen.add("teb_horizon", int_t, 0, "Number of poses in the TEB trajectory", 30, 3, 200)
gen.add("teb_dt_resolution", double_t, 0, "Base time resolution between poses (s)", 0.3, 0.01, 2.0)
gen.add("teb_iterations", int_t, 0, "Maximum number of optimization iterations", 100, 1, 1000)

# ============================================================
# Weight coefficients
# ============================================================
gen.add("weight_path", double_t, 0, "Weight for path following cost", 1.0, 0.0, 100.0)
gen.add("weight_obstacle", double_t, 0, "Weight for obstacle avoidance cost", 1.0, 0.0, 100.0)
gen.add("weight_velocity", double_t, 0, "Weight for velocity limit cost", 1.0, 0.0, 100.0)
gen.add("weight_acceleration", double_t, 0, "Weight for acceleration limit cost", 1.0, 0.0, 100.0)
gen.add("weight_time", double_t, 0, "Weight for time optimality cost (minimize total time)", 1.0, 0.0, 100.0)
gen.add("weight_smoothness", double_t, 0, "Weight for trajectory smoothness cost", 1.0, 0.0, 100.0)
gen.add("weight_kinematics", double_t, 0, "Weight for non-holonomic kinematics cost", 1.0, 0.0, 100.0)

# ============================================================
# Velocity limits
# ============================================================
gen.add("max_linear_vel", double_t, 0, "Maximum linear velocity (m/s)", 0.5, 0.0, 10.0)
gen.add("min_linear_vel", double_t, 0, "Minimum linear velocity (m/s)", 0.0, -10.0, 10.0)
gen.add("max_angular_vel", double_t, 0, "Maximum angular velocity (rad/s)", 1.5, 0.0, 10.0)
gen.add("min_angular_vel", double_t, 0, "Minimum angular velocity (rad/s)", 0.0, -10.0, 10.0)

# ============================================================
# Acceleration limits
# ============================================================
gen.add("max_linear_acc", double_t, 0, "Maximum linear acceleration (m/s^2)", 0.5, 0.0, 10.0)
gen.add("max_angular_acc", double_t, 0, "Maximum angular acceleration (rad/s^2)", 1.5, 0.0, 10.0)

# ============================================================
# Obstacle avoidance
# ============================================================
gen.add("obstacle_min_dist", double_t, 0, "Minimum distance to obstacles (m)", 0.2, 0.0, 2.0)
gen.add("inflate_obstacle_radius", double_t, 0, "Inflation radius for obstacles (m)", 0.5, 0.0, 5.0)

# ============================================================
# Optimization parameters
# ============================================================
gen.add("convergence_delta", double_t, 0, "Convergence threshold for optimizer", 0.001, 1e-6, 1.0)
gen.add("dt_hysteresis", double_t, 0, "Dt change damping factor", 0.1, 0.0, 1.0)

gen.add("restore_defaults", bool_t, 0, "Restore to the original configuration.", False)

exit(gen.generate("teb_controller", "teb_controller", "TEBController"))
